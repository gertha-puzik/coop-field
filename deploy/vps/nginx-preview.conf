# Фрагмент для preview: один server { } на slug.
# Не вставлять в прод-vhost комнаты и не слушать 8787.
# TLS: wildcard *.abnocw.miew.ru (Let's Encrypt DNS-01) — владелица ставит сама.
# deploy не имеет sudo на nginx (как с nginx-www.conf). Владелица один раз
# включает шаблон (подстановка __SLUG__ / __PORT__ / __ROOT__) от root.
#
# Пример после подстановки:
#   server_name cursor-foo.abnocw.miew.ru;
#   proxy_pass http://127.0.0.1:41012;

# __SLUG__ __PORT__ __ROOT__

server {
    listen 80;
    listen 443 ssl;
    server_name __SLUG__.abnocw.miew.ru;

    # ssl_certificate /etc/letsencrypt/live/abnocw.miew.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/abnocw.miew.ru/privkey.pem;

    root __ROOT__/www;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /health {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
    }

    location /auth {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /cfg {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /ws {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
    }
}
