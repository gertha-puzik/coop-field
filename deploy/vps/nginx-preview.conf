# Documentation copy of the preview vhost. The LIVE fragment is written
# inline by write_nginx_fragment() in preview-apply.sh — keep both in sync.
# Rules: never listen on 8787, never root at /opt/coop-field/www (prod).

server {
    listen 80;
    server_name __SLUG__.abnocw.miew.ru;

    root __ROOT__/www;
    index index.html;
    charset utf-8;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        # $uri.html: static export can emit page at <route>.html too;
        # $uri/: dir index for <route>/index.html layouts.
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /health {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
    }

    location /auth {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /cfg {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /ws {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
    }
}
