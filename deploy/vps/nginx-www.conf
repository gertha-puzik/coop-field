# Отдельный сайт фронта. Не вставлять в server комнаты.
# Сокет остаётся на coop.89-232-184-77.sslip.io, его vhost этот файл не описывает и не меняет.
#
# Actions кладёт файлы в /opt/coop-field/www и nginx не перечитывает.
# Пользователь deploy sudo на nginx не имеет. Фрагмент применяется вручную один раз от root.
#
# Слушает только 80. Сертификата для abnocw.89-232-184-77.sslip.io в репозитории нет.
# Заголовки и listen 443 — образец deploy/vps/nginx-grotto-tls.sample.conf.
# Этот файл их не включает: на сервер образец не установлен.
# Сертификат комнаты (Let's Encrypt) выписан только на coop.89-232-184-77.sslip.io
# и к этому имени не подходит. HTTPS появляется после выпуска своего сертификата, см. README.

server {
    listen 80;
    server_name abnocw.89-232-184-77.sslip.io;

    root /opt/coop-field/www;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
