# Фрагмент внутрь уже существующего server { } для coop.89-232-184-77.sslip.io.
# Не отдельный server: listen и сертификаты остаются как были.
# Вставить вместо location, который проксирует весь HTTP на комнату.
# Применяется вручную один раз от root. Actions этот файл на сервер не копирует
# и nginx не перечитывает. Пользователь deploy sudo на nginx не имеет.
#
# Статика: /opt/coop-field/www (rsync из workflow фронта, без перезапуска комнаты).
# Комната: 127.0.0.1:8787 — только WebSocket с корня (/) и GET /health.
# Пока фрагмент не вставлен, снаружи по-прежнему отвечает комната из своего public/.

location = /health {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Клиент открывает wss://этот-хост/ — тот же путь, что и страница.
# if здесь только с return: так nginx отличает Upgrade от файла.
location / {
    error_page 418 = @room;
    if ($http_upgrade ~* "^websocket$") {
        return 418;
    }

    root /opt/coop-field/www;
    index index.html;
    charset utf-8;
    try_files $uri $uri/ /index.html;
}

location /_next/static/ {
    root /opt/coop-field/www;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location @room {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}
