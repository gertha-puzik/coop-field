# ОБРАЗЕЦ. На сервер этим файлом ничего не установлено.
# nginx на VPS этот репозиторий сам не перечитывает. Пользователь deploy
# sudo на nginx не имеет. Подключает и делает reload только владелица, от root,
# после своего сертификата. Пока сертификата нет — не подменять действующий
# deploy/vps/nginx-www.conf (он слушает 80 и отдаёт сайт).
#
# Хосты фронта гротов из server/config.js: abnocw.89-232-184-77.sslip.io
# и abnocw.phainonsmilk.ru. Сокет комнаты (coop.89-232-184-77.sslip.io) и
# превью pr-<N>.* этим файлом не описываются.
#
# Сертификат должен покрывать оба server_name (или разнесите блоки).
# Пути ключей — заглушки Let's Encrypt, не секреты и не файлы репозитория.
#
# Заголовки — список из проверенного бэклога (A5): HSTS, CSP,
# X-Content-Type-Options, X-Frame-Options и frame-ancestors.
# script-src/style-src 'unsafe-inline': в src/app/layout.tsx тема ставится
# inline-скриптом до отрисовки, у кнопок есть style-атрибуты.
# connect-src на coop.89-232-184-77.sslip.io: страница sslip-грота открывает
# сокет и HTTP комнаты там (src/lib/net/coop.ts, PRODUCTION_WS).
# На abnocw.phainonsmilk.ru сокет same-origin, его покрывает 'self'.
#
# add_header в location затирает заголовки server. Поэтому сниппет стоит
# и в location /, и в location /_next/static/.

server {
    listen 80;
    server_name abnocw.89-232-184-77.sslip.io abnocw.phainonsmilk.ru;

    # Выпуск сертификата webroot'ом. Сам сайт по 80 после включения 443
    # уходит на https. До выпуска сертификата этот блок не применять:
    # иначе грот по HTTP перестанет открываться.
    location /.well-known/acme-challenge/ {
        root /opt/coop-field/www;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name abnocw.89-232-184-77.sslip.io abnocw.phainonsmilk.ru;

    ssl_certificate     /etc/letsencrypt/live/abnocw.89-232-184-77.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abnocw.89-232-184-77.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/coop-field/www;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://coop.89-232-184-77.sslip.io wss://coop.89-232-184-77.sslip.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://coop.89-232-184-77.sslip.io wss://coop.89-232-184-77.sslip.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://coop.89-232-184-77.sslip.io wss://coop.89-232-184-77.sslip.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
