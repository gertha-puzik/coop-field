# Один раз: /etc/nginx/sites-enabled/coop-field-previews.conf
# Не описывает прод (sslip.io / 8787 / /opt/coop-field/www).
# Фрагменты slug пишет preview-apply.sh в /etc/nginx/preview.d/preview-<slug>.conf
# и удаляет их на destroy. Пустой glob nginx не любит — zz-keep.conf держит каталог.

include /etc/nginx/preview.d/*.conf;
