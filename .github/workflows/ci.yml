name: Проверки

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "deploy/vps/**"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Типы и зависимости
    runs-on: ubuntu-latest
    steps:
      # actions закреплены SHA коммитов, а не плавающими тегами v4 (цепочка поставки)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      # C W1 build проверяет типы сам (next.config.ts больше не глушит ошибки),
      # но typecheck остаётся быстрой отдельной проверкой и главным гейтом CI.
      - name: Проверка типов
        run: npm run typecheck
      # Гейт архитектуры: лимит 800 строк + запрет lib -> components (W1).
      - name: Архитектурные границы
        run: npm run arch:check
      # Юнит-тесты движка через strip-types; на node 22 гоняются по-настоящему.
      - name: Юнит-тесты движка
        run: npm run test:unit
      - name: Версия ws в двух lockfile
        run: node scripts/check-ws-versions.mjs
      # Интеграционный тест: сервер поднимается сам, проверяет очередь шагов
      # (каждый ход получает ответ, гонки за клетку, переполнение очереди).
      - name: Очередь шагов на сервере
        run: node scripts/test-move-queue.mjs
