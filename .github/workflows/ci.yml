name: Проверки

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "server/**"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "deploy/**"
      - "AGENTS.md"
      - "docs/**"
      - "tsconfig.json"
      # A2/D4 (аудит Z.AI 2026-11-08): правки ЛЮБЫХ workflow и deploy-скриптов
      # требуют полного чека — раньше едва не «молча» обходили ci (фильтр знал
      # только ci.yml и deploy/vps/**).
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Типы и зависимости
    runs-on: ubuntu-latest
    steps:
      # actions закреплены SHA коммитов, а не плавающими тегами v4 (цепочка поставки)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      # C W1 build проверяет типы сам (next.config.ts больше не глушит ошибки),
      # но typecheck остаётся быстрой отдельной проверкой и главным гейтом CI.
      - name: Проверка типов
        run: npm run typecheck
      # Гейт архитектуры: лимит 800 строк + запрет lib -> components (W1).
      - name: Архитектурные границы
        run: npm run arch:check
      # Гейт протокола (W3): док-таблицы AGENTS.md == реестры server/protocol.js,
      # и в server.js нет строковых дублей имён событий (только импорт EV.*).
      - name: Синхронизация протокола и доков
        run: npm run check:protocol
      # Гейт док-подсказок (W7a): числа размеров модулей в картах кода
      # (AGENTS.md, docs/ARCHITECTURE.md §2) равны фактическим wc -l — дрейф = красный чек.
      - name: Актуальность док-подсказок
        run: npm run check:landmarks
      # Юнит-тесты движка через strip-types; на node 22 гоняются по-настоящему.
      - name: Юнит-тесты движка
        run: npm run test:unit
      # Golden-паритет протокола (W3): server/protocol.js == src/lib/net/protocol.ts
      # == золотые значения; под node 22 strip-types исполним, под старше — SKIP.
      - name: Паритет протокола
        run: npm run test:protocol-parity
      # Смоук модулей сервера (W4): каждый server/*.js импортируется без сети,
      # чистые функции дают золотые значения старого монолитного server.js.
      - name: Смоук модулей сервера
        run: npm run test:server-modules
      - name: Версия ws в двух lockfile
        run: node scripts/check-ws-versions.mjs
      # Интеграционный тест: сервер поднимается сам, проверяет очередь шагов
      # (каждый ход получает ответ, гонки за клетку, переполнение очереди).
      - name: Очередь шагов на сервере
        run: node scripts/test-move-queue.mjs
      - name: Аккаунты и закрытая Элизия
        run: npm run test:auth
      # B1: ~44 живых пробы кросс-доменной изоляции — сам поднимает
      # sandbox-сервер с обоими классами хостов (задача 4 / N3:
      # конвенция без гейта — AGENTS.md обещает, CI обязан гонять).
      - name: Кросс-доменная изоляция (B1)
        run: npm run test:cross-origin
      # §5 fail-closed: production/preview не могут стартовать с выключенным
      # CSRF (COOP_INSTANCE_CLASS-контракт), unknown-класс — тоже отказ.
      - name: CSRF fail-closed старт (§5)
        run: npm run test:csrf-startup
      # Админ-операция «сброс положения игрока на поле»: /admin/players*
      # (гейты 401/403/CSRF, живые координаты, кадр EV.MOVE, стирание
      # freemove-точки из книги, повторный join без прежней точки).
      - name: Сброс положения игрока (admin)
        run: npm run test:admin-reset
      # Менеджер спрайтов (ветка feature/elyria-admin-sprites-manager): сид
      # каталога из config.SPRITES, upload PNG c категорией (валидация
      # магии/лимита/имён), коллизия суффиксом, PATCH имя/категория,
      # DELETE с защитой одетых (wornBy через WS-attachSprite) и builtin,
      # двустороннее зеркало config.SPRITES для pickSprite/setSprite.
      - name: Менеджер спрайтов (admin)
        run: npm run test:sprites
      # Реестр конфига (P2→F2): whitelist из 6 ключей, клэмпы урона/брони,
      # админ-роуты /cfg (restore с path-guard, export/import), §4 playerSelectable.
      - name: Реестр конфига
        run: npm run test:cfg
      # F2 per-room конфиг: слои engine←global←room, /cfg/rooms* admin-роуты,
      # atmoset-гейт, persistence room-configs.json (бэкапы/restore), WS-ран.
      - name: Per-room конфиг комнат
        run: npm run test:room-config
      # HTTP-профили (P4): каталог карточек, публичный DTO, PATCH /profiles/me
      # строго по cookie-сессии.
      - name: HTTP-профили
        run: npm run test:profiles
      - name: Preview slug
        run: npm run test:preview-slug
      - name: Preview apply/destroy guards
        run: npm run test:preview-apply
      # Контракт артефакта preview-билда (two-state): dual/legacy-single
      # детект по package.json, валидации корней, SHA-гейт, режим из
      # metadata/каталогов — по синтетическим деревьям, без реальных сборок.
      - name: Preview build contract (dual + legacy-single)
        run: npm run test:preview-build-contract
      - name: Preview link (шапка PR)
        run: npm run test:preview-pr-link
      - name: OpenSSH PEM из однострочного секрета
        run: npm run test:write-openssh-key
