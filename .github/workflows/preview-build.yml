name: Preview PR (build)

# Безопасная половина preview-пайплайна (блокер-2 security-обзора PR #41).
# На pull_request GitHub исполняет workflow-файл ИЗ MERGE-РЕФА PR — автор
# ветки правит его как угодно. Поэтому здесь НЕТ ни одного секрета репо
# (PREVIEW_SSH_KEY недоступен), только одноразовый GITHUB_TOKEN: джоба
# собирает из head-SHA артефакт preview-дистрибутива. На VPS его выкладывает
# отдельный preview-deploy.yml (workflow_run): тот файл GitHub берёт всегда
# с main, PR его подменить не может, секреты доступны только ему.
# Прод-пайплайн (deploy-frontend / deploy-backend на main) не трогаем.
# Форки не собираем и не деплоим (head_repository проверяется и тут, и в deploy).
# Каталог/юнит/имена сайтов — pr-<номер PR>.
#
# TWO-STATE сборка (порядок мерджа PR #49/#50 не гарантирован): режим
# выводит scripts/preview-build-lib.mjs detect по package.json чекаута —
# есть scripts.build:variants → dual (www-grotto/ + www-elyria/), нет →
# legacy-single (одна сборка `npm run build` из out/ в www/). Легаси —
# честный одно-сайтовый артефакт с metadata {mode:'legacy-single'}:
# деплоер поднимет один хост pr-<N>.abnocw.phainonsmilk.ru, второй сайт не
# заявляется. Это НЕ фейк и НЕ ослабление — dual-превью появится после
# мерджа продуктового PR #49. Логика НЕ размазана по YAML-шеллу: упаковку
# и валидации делает тестируемый node-модуль preview-build-lib.mjs.
# Сборка из SHA коммита, не из ветки.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # GITHUB_TOKEN одноразовый, не секрет; нужен только для одного
  # маркер-комментария о провале сборки (обновляет существующий).
  pull-requests: write

jobs:
  build:
    name: Сборка preview-дистрибутива
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Детект режима сборки (dual | legacy-single)
        # Детект по package.json чекаута (НЕ по ветке): продукты без
        # build:variants идут легаси-контрактом и не должны падать CI.
        id: mode
        run: |
          set -euo pipefail
          MODE=$(node scripts/preview-build-lib.mjs detect)
          case "$MODE" in
            dual|legacy-single) : ;;
            *) echo "неизвестный режим: $MODE" >&2; exit 1 ;;
          esac
          echo "build_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "preview mode: $MODE (pr=${{ github.event.pull_request.number }}, sha=${{ github.event.pull_request.head.sha }})"

      - name: Сборка обоих вариантов сайта (dual)
        # Контракт с фазой P6: build:variants из ЭТОГО ЖЕ head-SHA собирает
        # оба Next-варианта и раскладывает статические корни в www-grotto/
        # (публичные «Пивные гроты») и www-elyria/ (Элизия).
        if: steps.mode.outputs.build_mode == 'dual'
        run: |
          set -euo pipefail
          npm ci
          npm run build:variants
          test -f www-grotto/index.html
          test -f www-elyria/index.html

      - name: Изоляция билд-вариантов (dual, только если скрипт в чекауте)
        # Обрезку чужих маршрутов делает продуктовый scripts/check-variants.mjs;
        # в чекаутах без него (main-линейные PR) шаг честно печатает скип.
        # Детект по ФАЙЛУ, а не uname/флагов: нельзя предполагать наличие.
        if: steps.mode.outputs.build_mode == 'dual'
        run: |
          set -euo pipefail
          if [ -f scripts/check-variants.mjs ]; then
            node scripts/check-variants.mjs
          else
            echo "skip: scripts/check-variants.mjs отсутствует в чекауте — обрезка маршрутов выполняется самим build:variants"
          fi

      - name: Сборка одного сайта (legacy-single)
        # Легаси-контракт main-линейных PR: одна сборка в out/. НЕ фейк:
        # артефакт честно одно-сайтовый, деплой поднимет только хост
        # pr-<N>.abnocw.phainonsmilk.ru, никаких заявлений про второй сайт.
        if: steps.mode.outputs.build_mode == 'legacy-single'
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f out/index.html
          echo "preview mode: legacy-single (build:variants отсутствует; dual-превью появится после мерджа PR #49)"

      - name: Preview-гейты
        run: |
          set -euo pipefail
          npm run test:preview-slug
          npm run test:preview-apply
          npm run test:preview-pr-link
          npm run test:write-openssh-key

      - name: Упаковка preview-дистрибутива
        # Ровно тот состав, что уезжает на VPS: server-код, статические
        # корни (dual: www-grotto + www-elyria; legacy: www из out/),
        # рантайм-скрипты, пакеты, ЯВНЫЙ metadata.json режима и штамп
        # preview-sha = head-SHA PR (деплой сверяет и отказывается
        # выкладывать устаревший артефакт). Упаковку и валидации делает
        # preview-build-lib.mjs — не YAML-шелл; после пака отдельный
        # гейт pack-check перепроверяет артефакт по заявленному режиму.
        run: |
          set -euo pipefail
          MODE="${{ steps.mode.outputs.build_mode }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          BRANCH="${{ github.event.pull_request.head.ref }}"
          PR="${{ github.event.pull_request.number }}"
          case "$MODE" in
            dual)
              node scripts/preview-build-lib.mjs pack-dual preview-dist --sha="$SHA" --branch="$BRANCH" --pr="$PR"
              ;;
            legacy-single)
              node scripts/preview-build-lib.mjs pack-legacy preview-dist --sha="$SHA" --branch="$BRANCH" --pr="$PR"
              ;;
          esac
          node scripts/preview-build-lib.mjs pack-check preview-dist "$MODE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: preview-dist
          retention-days: 7
          if-no-files-found: error

      - name: Комментарий при провале
        # Артефакта нет — деплоя этого коммита не будет. Маркер тот же, что у
        # preview-deploy.yml: комментарий ОДИН на PR, обновляется, не плодится.
        # Секретов не касаемся.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          MARKER="<!-- coop-field-preview -->"
          BODY="${MARKER}
          Сборка preview не прошла (коммит \`${SHA:0:7}\`): артефакт не собран, выкладки этого коммита не будет.
          Лог: ${URL}. Если preview уже был — он продолжает работать со своего последнего успешного коммита.
          Пушь исправление — preview поднимется с нового коммита сам."
          CID=$(gh api "repos/$REPO/issues/$PR/comments" --jq ".[] | select(.body|startswith(\"${MARKER}\")) | .id" | tail -n 1)
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$BODY"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY"
          fi

  rapid:
    name: Rapid run (закрыт — не собираем)
    # Артефакт не нужен: снос сделает preview-deploy.yml по workflow_run
    # (state PR закрыт → PREVIEW_ACTION=destroy). Форки тоже ничего не ждут.
    if: github.event.action == 'closed' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Ничего не собираем
        run: |
          echo "PR закрыт (merge/close) или форк: артефакт не собирается."
          echo "Снос окружения (для закрытых PR своего репо) — preview-deploy.yml по workflow_run."
