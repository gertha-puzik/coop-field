name: Фронтенд на VPS

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/prune-export.mjs"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vps:
    name: Статика на VPS
    runs-on: ubuntu-latest
    concurrency:
      group: coop-field-frontend-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Сборка статического экспорта
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f out/index.html
      - name: Сборка вариантов сайта (гроты + Элизия)
        # Контракт preview-build.yml («Сборка обоих вариантов сайта»): скрипт
        # build:variants оставляет в корне репо www-grotto/ и www-elyria/
        # с index.html в каждом и обрезкой чужих для варианта маршрутов.
        # Ванильный out/ собран и проверен шагом выше; build:variants дважды
        # пересобирает out/ (NEXT_PUBLIC_SITE=grotto, затем elyria) — на VPS
        # уезжает пара вариантных корней вместо одного полного out/.
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          npm run build:variants
          test -f www-grotto/index.html
          test -f www-elyria/index.html

      # ── Staged deploy: согласованность двух сайтов ────────────────────────
      #
      # Проблема прошлой схемы: два независимых шага rsync. Заливка гротов
      # проходит, заливка Элизии падает — на проде два сайта с несогласо-
      # ванными версиями движка/протокола (комнаты кочуют между ними, ws
      # ломается молча). Новая схема: ОБА корня сначала едут в stage-каталоги
      # (/opt/coop-field/www.staging и /opt/coop-field/www-elyria.staging),
      # проходя минимальную верификацию, и лишь затем пара промоутится
      # атомарно (mv) в финальные имена; предыдущая выкладка остаётся в
      # .prev (один снимок назад). Ошибка на любом шаге — финальные корни
      # не меняются вовсе.
      - name: Изоляция вариантов (A1)
        # Задача 3 (N4): проверка обрезки чужих маршрутов обязана жить в самом
        # прод-деплое, не только в PR-пути (merge-коммит ≠ head-SHA PR;
        # политика «PR-only» держится на дисциплине). Гейт стоит ДО staging-заливки:
        # изолированный брак не уезжает на VPS даже в staging.
        run: |
          set -euo pipefail
          node scripts/check-variants.mjs www-grotto www-elyria

      - name: Staging-заливка обоих корней
        # www.staging / www-elyria.staging — НЕ читаются nginx'ом: это
        # «зелёная зона», сюда можно лить что угодно без риска для прода.
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: 89.232.184.77
          SSH_USER: deploy
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ]; then
            echo "секрет VPS_SSH_KEY пуст" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '89.232.184.77 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDxM5G0ydWqnLcTcPAPUWYgBRspDlaV1oQzkUO2lJzNF' >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          if ! $SSH "$SSH_USER@$SSH_HOST" "test -w /opt/coop-field && mkdir -p /opt/coop-field/www.staging /opt/coop-field/www-elyria.staging && test -w /opt/coop-field/www.staging && test -w /opt/coop-field/www-elyria.staging"; then
            echo "нет записи в stage-каталоги /opt/coop-field/www{,-elyria}.staging ИЛИ в сам /opt/coop-field" >&2
            echo "промоушн делает mv/rm в САМОМ /opt/coop-field (mv www www.prev и т.д.) — нужна запись в каталог, а не только в www-elyria/; без неё первый прод-деплой после мерджа упадёт на промоушне (fail-safe: прод цел, деплой сломан до ручной правки)" >&2
            echo "один раз от root, вариант A: chgrp deploy /opt/coop-field && chmod g+w /opt/coop-field" >&2
            echo "вариант B (жёстче): root-owned скрипт промоушна + sudoers-строка только на него — см. docs" >&2
            echo "ПРЕД НЕ СОСКОЛЬЗНУЛ: финальные www/ и www-elyria/ не тронуты" >&2
            exit 1
          fi
          # --delete только внутри stage-каталогов: свежая пара гарантированно
          # без файлов прошлых выкладок. Код комнаты (server) не затрагивается.
          rsync -az --delete -e "$SSH" \
            www-grotto/ \
            "$SSH_USER@$SSH_HOST:/opt/coop-field/www.staging/"
          rsync -az --delete -e "$SSH" \
            www-elyria/ \
            "$SSH_USER@$SSH_HOST:/opt/coop-field/www-elyria.staging/"
          # Права читаемости — на stage, ДО промоушна: после mv nginx сразу
          # отдаёт файлы, отдельного chmod в финальных корнях больше нет.
          $SSH "$SSH_USER@$SSH_HOST" "chmod -R a+rX /opt/coop-field/www.staging /opt/coop-field/www-elyria.staging"
          echo "оба корня в staging: /opt/coop-field/www.staging + /opt/coop-field/www-elyria.staging"

      - name: Верификация stage-корней
        # Минимум, без которого промоушн не имеет смысла: index.html на месте
        # у ОБОИХ вариантов и структура _next живая (Next export: чанки
        # лежат в _next/static — пустой _next = битая сборка, которую nginx
        # молча отдаст как 404 на каждый чанк).
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: 89.232.184.77
          SSH_USER: deploy
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '89.232.184.77 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDxM5G0ydWqnLcTcPAPUWYgBRspDlaV1oQzkUO2lJzNF' >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          $SSH "$SSH_USER@$SSH_HOST" '
            set -eu
            for root in www.staging www-elyria.staging; do
              test -f "/opt/coop-field/$root/index.html" || { echo "FAIL: нет /opt/coop-field/$root/index.html" >&2; exit 1; }
              test -d "/opt/coop-field/$root/_next"   || { echo "FAIL: нет /opt/coop-field/$root/_next (Next-структура)" >&2; exit 1; }
              test -d "/opt/coop-field/$root/_next/static" || { echo "FAIL: нет _next/static у $root" >&2; exit 1; }
              [ -n "$(ls -A "/opt/coop-field/$root/_next/static" 2>/dev/null)" ] || { echo "FAIL: _next/static пуст у $root" >&2; exit 1; }
              echo "VERIFIED: /opt/coop-field/$root (index.html + _next/static на месте)"
            done
          '
          echo "stage-корни верифицированы: prod пока не тронут"

      - name: Атомарный промоушн пары корней
        # Промоушн = четыре rename в одном ssh-сеансе: старые финальные корни
        # уезжают в .prev (бэкап ровно ОДНОЙ прошлой выкладки), stage-корни
        # встают на финальные имена. Если промоушн падает на второй паре —
        # удалённый сценарий сам откатывает ОБА сайта к состоянию до промоушна
        # (.prev возвращаются на место); после этого шаг красный, прод живой
        # и согласованный. Ручной откат для владельца: см. сообщение в else-ветке.
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: 89.232.184.77
          SSH_USER: deploy
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '89.232.184.77 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDxM5G0ydWqnLcTcPAPUWYgBRspDlaV1oQzkUO2lJzNF' >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          $SSH "$SSH_USER@$SSH_HOST" '
            set -eu
            cd /opt/coop-field
            # Предусловия: stage-пара на месте и верифицирована шагом выше.
            test -d www.staging && test -d www-elyria.staging || { echo "FAIL: stage-пара неполна, промоушн не начинаем" >&2; exit 1; }
            # Снимаем ровно один прошлый бэкап (старее — теряем осознанно).
            rm -rf www.prev www-elyria.prev
            had_prev=0
            if [ -d www ]; then mv www www.prev; had_prev=1; fi
            if [ -d www-elyria ]; then mv www-elyria www-elyria.prev; had_prev=1; fi
            if mv www.staging www && mv www-elyria.staging www-elyria; then
              echo "PROMO-OK: /opt/coop-field/www + /opt/coop-field/www-elyria из staging, прежние в .prev"
            else
              echo "PROMO-FAIL: откатываю пару к состоянию до промоушна" >&2
              rm -rf www www-elyria
              if [ "$had_prev" = 1 ]; then
                mv www.prev www 2>/dev/null || true
                mv www-elyria.prev www-elyria 2>/dev/null || true
              fi
              echo "Ручной откат (если что-то не так, от deploy@vps):" >&2
              echo "  cd /opt/coop-field && rm -rf www www-elyria && mv www.prev www && mv www-elyria.prev www-elyria" >&2
              exit 1
            fi
          '
          echo "прод-фронт согласован: оба корня из одной сборки. сервис coop-field не перезапускался (статика, nginx читает по запросу)."
