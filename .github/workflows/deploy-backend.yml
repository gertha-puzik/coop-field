name: Сервер комнаты на VPS

on:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "server/**"
      - "scripts/**"
      - "deploy/vps/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: coop-field-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # SHA-пин вместо плавающего тега v4 (цепочка поставки)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Заливка комнаты и перезапуск
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: 89.232.184.77
          SSH_USER: deploy
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ]; then
            echo "секрет VPS_SSH_KEY пуст" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '89.232.184.77 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDxM5G0ydWqnLcTcPAPUWYgBRspDlaV1oQzkUO2lJzNF' >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          rsync -az -e "$SSH" \
            server.js \
            deploy/vps/package.json \
            deploy/vps/package-lock.json \
            deploy/vps/apply.sh \
            "$SSH_USER@$SSH_HOST:incoming/"
          # --delete только у scripts/ и server/ в incoming. /opt/coop-field/www — статика фронта, её не трогаем.
          rsync -az --delete -e "$SSH" \
            scripts/ \
            "$SSH_USER@$SSH_HOST:incoming/scripts/"
          # Каталог серверного канона протокола (W3): server.js импортирует из него.
          rsync -az --delete -e "$SSH" \
            server/ \
            "$SSH_USER@$SSH_HOST:incoming/server/"
          $SSH "$SSH_USER@$SSH_HOST" "bash incoming/apply.sh"
